display_information:
  name: Coder Slackbot
  description: AI assistant powered by Coder
  background_color: "#2B2D31"
features:
  bot_user:
    display_name: Coder Slackbot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:write
      # channels:history / groups:history are broad-read scopes. Keep them ONLY
      # if the bot must read thread replies in channels it is invited to;
      # decide per sendbird_override.md before requesting review.
      - channels:history
      - groups:history
      - users:read
      # users:read.email removed (Sendbird fork): user email is employee PII
      # and the code no longer exposes it to the model.
      # For DM-notification bots: drop the two history scopes above and use
      # im:history + im:read instead (see sendbird_override.md §2.2).
      - assistant:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
